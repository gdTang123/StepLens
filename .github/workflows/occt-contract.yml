name: occt-contract

# G1-7：Linux 无头 OCCT 内核契约单测。独立于 ci.yml，周严接入主流程时可以整份搬。
# 主路径是产品锁定的 7.9.3。8.0.1 留在矩阵里做对照（conda 预编译包），不是默认依赖。
# 只在契约测试、io、model、mesh、occtsupport、cmake 或本 workflow 变化时跑，避免每个 PR 都装 OCCT。
# 预编译包没有插桩。ASan 覆盖本仓库的测试代码，看不到 TK* 内部的数据竞争。
on:
  pull_request:
    paths:
      - "tests/**"
      - "src/io/**"
      - "src/model/**"
      - "src/mesh/**"
      - "src/occtsupport/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/occt-contract.yml"
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "src/io/**"
      - "src/model/**"
      - "src/mesh/**"
      - "src/occtsupport/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/occt-contract.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: occt-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: occt-${{ matrix.occt }}-${{ matrix.role }}-asan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - occt: "7.9.3"
            role: default
          - occt: "8.0.1"
            role: comparison
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install conda-forge OCCT
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: cmake/conda/occt-contract-${{ matrix.occt }}.yml
          environment-name: occt-contract-${{ matrix.occt }}
          cache-environment: true
          cache-downloads: true
          create-args: --channel-priority strict
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict

      - name: Configure, build, and run contract tests under ASan
        shell: micromamba-shell {0}
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
        run: |
          set -euo pipefail
          echo "CONDA_PREFIX=${CONDA_PREFIX}"
          "${CONDA_PREFIX}/bin/g++" --version | head -1
          cmake -S . -B build/occt-contract -G Ninja \
            -DSTEPLENS_OCCT_CONTRACT=ON \
            -DSTEPLENS_EXPECTED_OCCT="${{ matrix.occt }}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER="${CONDA_PREFIX}/bin/g++" \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build/occt-contract
          test_bin="$(find build/occt-contract -type f -name steplens_occt_contract -executable | head -1)"
          if [[ -z "${test_bin}" ]]; then
            echo "没有找到 steplens_occt_contract"
            exit 1
          fi
          if ! ldd "${test_bin}" | grep -q 'libasan'; then
            echo "契约测试没有链接 ASan: ${test_bin}"
            ldd "${test_bin}"
            exit 1
          fi
          ctest --test-dir build/occt-contract --output-on-failure -L occt-contract

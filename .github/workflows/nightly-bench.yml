name: nightly-bench

# 不设 schedule。托管 runner 没有基准机的 GPU，也没有 2 GB 样例。
# 私有仓库分钟数有限。自托管 runner（建议标签 steplens-bench）和额度确认后再加 cron。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: not-wired
    runs-on: ubuntu-latest
    steps:
      - name: 夜间基准尚未接入
        run: |
          echo "steplens-bench 属于 T02/T19。"
          echo "接入时把 runs-on 改成自托管 Windows 基准机，并只在那台机器上跑大文件和超大文件。"
          exit 1

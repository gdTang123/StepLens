name: ci

# PR，以及推送到 main 或 v* 标签。仓库已公开，标准托管 runner 不限分钟；仍不设矩阵、不设 schedule。
# 二进制缓存未命中时会从源码编译 OCCT 7.9.3，第一次大约两个半小时，超时留到四小时，避免缓存上传被掐掉。
# 只改文档时不触发：docs/**（含图片等非 Markdown），以及任意位置的 .md。
# bench 清单因此跳过。bench 的代码、脚本和 CMake 不匹配这些模式，改了仍会跑。
# workflow、vcpkg 清单、packaging 脚本和 CMake 逻辑同样不在忽略列表里。
# 标签推送不做路径过滤（GitHub 不对 tag 计算 paths-ignore），v* 总会跑，并在 Windows 作业里打 zip。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**.md'
      - '**/*.md'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# 同一 PR 的新推送才取消旧运行。push 和 workflow_dispatch 不取消。
# group 带上事件名，所以 main 上的 push 与手动触发各占一组。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux 托管 runner 比 Windows 便宜。只编 core，不下载 Qt、不编 OCCT。
  core:
    name: core-tests-tsan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ cmake ninja-build

      - name: Configure, build, test with TSan
        run: |
          cmake -S . -B build/core -G Ninja \
            -DSTEPLENS_CORE_ONLY=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/core
          ctest --test-dir build/core --output-on-failure
          python3 scripts/test_t03_tools.py

      - name: Check vcpkg manifests and OCCT version macro
        run: |
          python3 scripts/check_manifests.py
          hits=$(git grep -n OCC_VERSION_HEX -- '*.h' '*.hpp' '*.cpp' '*.cxx' ':!src/occtsupport/occt_compat.h' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "OCC_VERSION_HEX 只能出现在 src/occtsupport/occt_compat.h"
            exit 1
          fi
          git grep -n OCC_VERSION_HEX -- src/occtsupport/occt_compat.h >/dev/null

  windows:
    name: windows-build
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: clang-format
        run: |
          $clangFormat = "C:\Program Files\LLVM\bin\clang-format.exe"
          if (-not (Test-Path -LiteralPath $clangFormat)) {
            throw "windows-2022 镜像上未找到 $clangFormat（镜像说明里有 LLVM）"
          }
          $files = @(git ls-files "*.h" "*.cpp")
          if ($files.Count -eq 0) { throw "没有 C++ 文件" }
          & $clangFormat --dry-run --Werror @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout vcpkg 2026.10.16
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9eec002df1cd109f8f104cd966a763daf9751489
          path: vcpkg
          fetch-depth: 1

      # restore + 编译成功后立刻 save。actions/cache 的保存挂在整次 job 成功上，
      # 打包或冒烟失败时 Post Cache 会被跳过，OCCT 就得重编。
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-binary-cache
            vcpkg/downloads
          key: vcpkg-occt793-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg-configs/occt-7.9.3/vcpkg.json', 'vcpkg-configs/occt-7.9.3/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-occt793-${{ runner.os }}-x64-windows-

      - name: Bootstrap vcpkg
        run: |
          # vcpkg.exe 的发布下载偶发 504。多试几次，最后一次的退出码仍会失败。
          $bootstrapped = $false
          foreach ($attempt in 1..4) {
            & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -eq 0) {
              $bootstrapped = $true
              break
            }
            Write-Host "bootstrap-vcpkg failed with exit $LASTEXITCODE (attempt $attempt)"
            if ($attempt -lt 4) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (-not $bootstrapped) { exit 1 }
          New-Item -ItemType Directory -Force -Path .vcpkg-binary-cache | Out-Null
          $cache = (Join-Path (Get-Location) ".vcpkg-binary-cache") -replace '\\', '/'
          $root = Join-Path (Get-Location) "vcpkg"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "VCPKG_ROOT=$root"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "VCPKG_DISABLE_METRICS=1"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite"
          # 镜像里已经有 ninja。不要再从 GitHub releases 下载，那边现在会 504。
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "VCPKG_FORCE_SYSTEM_BINARIES=1"

      # Qt 6.11 起 Windows 仓库按编译器拆目录：qt6_6120/qt6_6120_msvc2022_64/Updates.xml。
      # PyPI 上的 aqtinstall 3.3.0 仍去找 qt6_6120/qt6_6120/Updates.xml（404）。
      # 8c3695d 是已合并的 “Support Qt 6.11+ for Windows x64”，尚未发版。
      - name: Restore Qt 6.12.0
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt\6.12.0\msvc2022_64
          key: qt-6.12.0-win64_msvc2022_64-base

      - name: Install Qt 6.12.0 from download.qt.io
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          python -m aqt version
          $qtRoot = "C:\Qt"
          # qttools（含 Linguist）已经打进基础包 qt.qt6.6120.win64_msvc2022_64，不是独立模块。
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 `
            --outputdir $qtRoot --base https://download.qt.io
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Point CMake at Qt
        run: |
          $qtDir = "C:\Qt\6.12.0\msvc2022_64"
          $qmake = Join-Path $qtDir "bin\qmake.exe"
          if (-not (Test-Path -LiteralPath $qmake)) { throw "Qt 安装后未找到 $qmake" }
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "QTDIR=$qtDir"
          Add-Content -Path $env:GITHUB_PATH -Encoding utf8NoBOM -Value (Join-Path $qtDir "bin")

      - name: Save Qt cache
        if: success() && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt\6.12.0\msvc2022_64
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 镜像自带的 ninja 是 1.12.1。vcpkg 要求 1.13.1，不够就会自己下载，GitHub releases 现在会 504。
      - name: Put ninja 1.13.1 on PATH
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ninja-1.13.1"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ninja-win-1.13.1.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v1.13.1/ninja-win.zip"
          & curl.exe -fL --retry 8 --retry-all-errors --retry-delay 5 -o $zip $url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $zip)) {
            Write-Host "ninja 1.13.1 没下下来，继续。vcpkg 会再试一次。"
            exit 0
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $ninja = Join-Path $dir "ninja.exe"
          if (-not (Test-Path -LiteralPath $ninja)) { throw "解压后没有 $ninja" }
          & $ninja --version
          Add-Content -Path $env:GITHUB_PATH -Encoding utf8NoBOM -Value $dir

      - name: Configure, build, test
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "QTDIR=$env:QTDIR"
          cmake --version
          cmd /c "cmake --workflow --preset ci > build-msvc.log 2>&1"
          $buildCode = $LASTEXITCODE
          Get-Content -LiteralPath build-msvc.log
          if ($buildCode -ne 0) { exit $buildCode }
          pwsh -File scripts/check_build_log.ps1 -Log build-msvc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/verify_occt_link.ps1 -BuildDir build/msvc -Report build/msvc/occt-link-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 契约腿是 ASan，不能代表产品分配器。这条是 RelWithDebInfo、无 sanitizer。
      # --verbose 让通过时的 memory_round 也进日志。--no-tests=error 避免测试没编进去还算过。
      - name: Memory release on the product allocator
        run: |
          ctest --preset unit -C RelWithDebInfo -R "^MemoryRelease\.SyntheticOpenCloseStaysNearBaseline$" --output-on-failure --verbose --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 400/1200 盒 STEP：加载、网格化、后台 Close、releaseFreedHeap。普通 unit 不设变量所以跳过。
      # --verbose 让通过时的 step_heap_repro 行留在日志里。测试自己跑 10 轮。
      - name: Step heap repro on the product allocator
        env:
          STEPLENS_STEP_HEAP_REPRO: "1"
        run: |
          ctest --preset unit -C RelWithDebInfo -R "^StepHeapRepro\." --output-on-failure --verbose --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check vcpkg binary cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          $files = @(Get-ChildItem -LiteralPath .vcpkg-binary-cache -Recurse -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw ".vcpkg-binary-cache 是空的，拒绝写入空缓存" }
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host ("vcpkg binary cache: {0} files, {1:N1} MiB" -f $files.Count, ($bytes / 1MB))

      - name: Save vcpkg binary cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-binary-cache
            vcpkg/downloads
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build bench tools against the installed OCCT
        run: |
          $prefix = Join-Path (Get-Location) "build\msvc\vcpkg_installed\x64-windows"
          cmd /c "cmake -S bench -B build/bench -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=`"$prefix`" -DSTEPLENS_EXPECTED_OCCT=7.9.3 > build-bench-config.log 2>&1"
          $configCode = $LASTEXITCODE
          Get-Content -LiteralPath build-bench-config.log
          if ($configCode -ne 0) { exit $configCode }
          cmd /c "cmake --build build/bench > build-bench.log 2>&1"
          $buildCode = $LASTEXITCODE
          Get-Content -LiteralPath build-bench.log
          if ($buildCode -ne 0) { exit $buildCode }
          pwsh -File scripts/check_build_log.ps1 -Log build-bench-config.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/check_build_log.ps1 -Log build-bench.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/verify_occt_link.ps1 -BuildDir build/bench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$pwd\build\msvc\vcpkg_installed\x64-windows\bin;$env:PATH"
          & "$pwd\build\bench\test_compat.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # zip 只在推送到 main 和 v* 标签时产生。PR 不上传 artifact。
      # 缓存保存发生在这一步之前，跳过打包不会丢掉 vcpkg/Qt 缓存。
      - name: Package zip
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          cmake --install build/msvc --config RelWithDebInfo --prefix "$pwd\dist-stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python scripts/package.py `
            --prefix "$pwd\dist-stage" `
            --qt-dir "$env:QTDIR" `
            --output "$pwd\dist\StepLens-0.1.0-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload zip
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-windows-x64
          path: dist/StepLens-0.1.0-windows-x64.zip
          retention-days: 7

      # 冒烟读的是 build 目录里的 StepLens.exe，不依赖上面的 zip。PR 上打包被跳过时这里仍然跑。
      - name: Smoke the empty window offscreen
        run: |
          # G1-5：离屏平台没有可判定的 GPU 帧缓冲。这里只确认进程还活着。
          # 100%/150% DPI、resize、逐帧不是单色，见 docs/bench/t09-gpu-smoke-checklist.md。
          # 缺帧缓冲内容不得让本作业变红。程序在 offscreen 下不创建 ViewerWidget。
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = Join-Path $env:QTDIR "plugins"
          $vcpkgBin = Join-Path (Get-Location) "build\msvc\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$vcpkgBin;$(Join-Path $env:QTDIR 'bin');$env:PATH"
          $exe = Join-Path (Get-Location) "build\msvc\RelWithDebInfo\StepLens.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "未找到 $exe" }
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "空窗口进程提前退出，退出码 $($proc.ExitCode)。这一步用的是 QT_QPA_PLATFORM=offscreen，不是交互式桌面。"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "空窗口在 offscreen 平台下保持运行"
          # 模型已经显示后再关窗口。合成 STEP，不依赖 STEPLENS_SAMPLES。
          # 进程应正常退出：后台 Close 还没完时直接结束，不和 OCCT 静态析构抢。
          $env:STEPLENS_APP_EXIT = "1"
          ctest --preset unit -C RelWithDebInfo -R "^AppExit\.CloseAfterDisplayedModelExitsCleanly$" --no-tests=error --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "显示模型后关闭窗口没有干净退出，退出码 $LASTEXITCODE" }
          $closeLog = Join-Path (Split-Path -Parent $exe) "logs\steplens.log"
          if (-not (Test-Path -LiteralPath $closeLog)) { throw "未找到退出日志 $closeLog" }
          Write-Host "---- steplens.log ----"
          Get-Content -LiteralPath $closeLog
          Write-Host "---- end steplens.log ----"
          $hit = Select-String -LiteralPath $closeLog -Pattern "退出时文档仍在后台关闭，结束进程" -SimpleMatch
          if (-not $hit) { throw "日志里没有后台关闭后结束进程这一行" }

      - name: clang-tidy changed C++ files
        run: |
          $clangTidy = "C:\Program Files\LLVM\bin\clang-tidy.exe"
          if (-not (Test-Path -LiteralPath $clangTidy)) { throw "未找到 $clangTidy" }
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = git merge-base HEAD "origin/$env:GITHUB_BASE_REF"
          } else {
            $base = "HEAD~1"
          }
          $files = @(git diff --name-only --diff-filter=ACMR $base HEAD)
          # bench/ 是独立摸底工具，编译数据库在 build/bench，不在主工程这份里。
          $cpp = @($files | Where-Object { $_ -match '\.cpp$' -and $_ -notmatch '^bench/' })
          if ($cpp.Count -eq 0) {
            Write-Host "没有改动的 .cpp，跳过 clang-tidy"
            exit 0
          }
          # clang-cl 不认识 /MP 和 /external:anglebrackets，clang-tidy 会把这两条未使用参数当成错误。
          # /w 只关掉编译器警告。/WX 仍留给 cl.exe。clang-tidy 自己的检查还在。
          python scripts/select_compile_commands.py `
            --input build/msvc/compile_commands.json `
            --output-dir build/msvc-tidy `
            --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clangTidy -p build/msvc-tidy `
            --extra-arg-before=--driver-mode=cl `
            --extra-arg=-Wno-unused-command-line-argument `
            --extra-arg=/w `
            @cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

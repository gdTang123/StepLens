name: ci

# PR，以及推送到 main 或 v* 标签。仓库已公开，标准托管 runner 不限分钟；仍不设矩阵、不设 schedule。
# 二进制缓存未命中时会从源码编译 OCCT 7.9.3，第一次大约两个半小时，超时留到四小时，避免缓存上传被掐掉。
# 只改文档时不触发：docs/**（含图片等非 Markdown），以及任意位置的 .md。
# bench 清单因此跳过。bench 的代码、脚本和 CMake 不匹配这些模式，改了仍会跑。
# workflow、vcpkg 清单、packaging 脚本和 CMake 逻辑同样不在忽略列表里。
# 标签推送不做路径过滤（GitHub 不对 tag 计算 paths-ignore），v* 总会跑，并在 Windows 作业里打 zip。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**.md'
      - '**/*.md'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      mode:
        description: default 跑现有 CI。只有精确值 redist-probe 才做只读采件，不编译产品。
        required: false
        default: default
        type: choice
        options:
          - default
          - redist-probe

permissions:
  contents: read
  actions: write

# 同一 PR 的新推送才取消旧运行。push 和 workflow_dispatch 不取消。
# group 带上事件名，所以 main 上的 push 与手动触发各占一组。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux 托管 runner 比 Windows 便宜。只编 core，不下载 Qt、不编 OCCT。
  core:
    name: core-tests-tsan
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'redist-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ cmake ninja-build

      - name: Configure, build, test with TSan
        run: |
          cmake -S . -B build/core -G Ninja \
            -DSTEPLENS_CORE_ONLY=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/core
          ctest --test-dir build/core --output-on-failure
          python3 scripts/test_t03_tools.py

      - name: Check vcpkg manifests and OCCT version macro
        run: |
          python3 scripts/check_manifests.py
          hits=$(git grep -n OCC_VERSION_HEX -- '*.h' '*.hpp' '*.cpp' '*.cxx' ':!src/occtsupport/occt_compat.h' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "OCC_VERSION_HEX 只能出现在 src/occtsupport/occt_compat.h"
            exit 1
          fi
          git grep -n OCC_VERSION_HEX -- src/occtsupport/occt_compat.h >/dev/null

  windows:
    name: windows-build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'redist-probe'
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build identity regression
        run: |
          & ./.github/scripts/Assert-SteplensBuildIdentity.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: clang-format
        run: |
          $clangFormat = "C:\Program Files\LLVM\bin\clang-format.exe"
          if (-not (Test-Path -LiteralPath $clangFormat)) {
            throw "windows-2022 镜像上未找到 $clangFormat（镜像说明里有 LLVM）"
          }
          $files = @(git ls-files "*.h" "*.cpp")
          if ($files.Count -eq 0) { throw "没有 C++ 文件" }
          & $clangFormat --dry-run --Werror @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout vcpkg 2026.10.16
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9eec002df1cd109f8f104cd966a763daf9751489
          path: vcpkg
          fetch-depth: 1

      # restore + 编译成功后立刻 save。actions/cache 的保存挂在整次 job 成功上，
      # 打包或冒烟失败时 Post Cache 会被跳过，OCCT 就得重编。
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-binary-cache
            vcpkg/downloads
          key: vcpkg-occt793-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg-configs/occt-7.9.3/vcpkg.json', 'vcpkg-configs/occt-7.9.3/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-occt793-${{ runner.os }}-x64-windows-

      - name: Bootstrap vcpkg
        run: |
          # vcpkg.exe 的发布下载偶发 504。多试几次，最后一次的退出码仍会失败。
          $bootstrapped = $false
          foreach ($attempt in 1..4) {
            & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -eq 0) {
              $bootstrapped = $true
              break
            }
            Write-Host "bootstrap-vcpkg failed with exit $LASTEXITCODE (attempt $attempt)"
            if ($attempt -lt 4) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (-not $bootstrapped) { exit 1 }
          New-Item -ItemType Directory -Force -Path .vcpkg-binary-cache | Out-Null
          $cache = (Join-Path (Get-Location) ".vcpkg-binary-cache") -replace '\\', '/'
          $root = Join-Path (Get-Location) "vcpkg"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "VCPKG_ROOT=$root"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "VCPKG_DISABLE_METRICS=1"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite"
          # 镜像里已经有 ninja。不要再从 GitHub releases 下载，那边现在会 504。
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "VCPKG_FORCE_SYSTEM_BINARIES=1"

      # Qt 6.11 起 Windows 仓库按编译器拆目录：qt6_6120/qt6_6120_msvc2022_64/Updates.xml。
      # PyPI 上的 aqtinstall 3.3.0 仍去找 qt6_6120/qt6_6120/Updates.xml（404）。
      # 8c3695d 是已合并的 “Support Qt 6.11+ for Windows x64”，尚未发版。
      - name: Restore Qt 6.12.0
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt\6.12.0\msvc2022_64
          key: qt-6.12.0-win64_msvc2022_64-base

      - name: Install Qt 6.12.0 from download.qt.io
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          python -m aqt version
          $qtRoot = "C:\Qt"
          # qttools（含 Linguist）已经打进基础包 qt.qt6.6120.win64_msvc2022_64，不是独立模块。
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 `
            --outputdir $qtRoot --base https://download.qt.io
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Point CMake at Qt
        run: |
          $qtDir = "C:\Qt\6.12.0\msvc2022_64"
          $qmake = Join-Path $qtDir "bin\qmake.exe"
          if (-not (Test-Path -LiteralPath $qmake)) { throw "Qt 安装后未找到 $qmake" }
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "QTDIR=$qtDir"
          Add-Content -Path $env:GITHUB_PATH -Encoding utf8NoBOM -Value (Join-Path $qtDir "bin")

      - name: Save Qt cache
        if: success() && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt\6.12.0\msvc2022_64
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 镜像自带的 ninja 是 1.12.1。vcpkg 要求 1.13.1，不够就会自己下载，GitHub releases 现在会 504。
      - name: Put ninja 1.13.1 on PATH
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ninja-1.13.1"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ninja-win-1.13.1.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v1.13.1/ninja-win.zip"
          & curl.exe -fL --retry 8 --retry-all-errors --retry-delay 5 -o $zip $url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $zip)) {
            Write-Host "ninja 1.13.1 没下下来，继续。vcpkg 会再试一次。"
            exit 0
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $ninja = Join-Path $dir "ninja.exe"
          if (-not (Test-Path -LiteralPath $ninja)) { throw "解压后没有 $ninja" }
          & $ninja --version
          Add-Content -Path $env:GITHUB_PATH -Encoding utf8NoBOM -Value $dir

      # 配置和编译与 unit 分开。unit 失败不能跳过后面的 Viewer 采证，构建失败也不能拿旧 exe。
      # 不用 continue-on-error：unit 这一步自己失败，作业就保持红色，后面的成功步骤不能把它改绿。
      - name: Configure and build
        id: product-build
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "QTDIR=$env:QTDIR"
          cmake --version
          $stamp = Join-Path (Get-Location) "build\msvc\this-build-succeeded.txt"
          if (Test-Path -LiteralPath $stamp) { Remove-Item -LiteralPath $stamp -Force }
          cmd /c "cmake --preset msvc > build-msvc-configure.log 2>&1"
          $configureCode = $LASTEXITCODE
          Get-Content -LiteralPath build-msvc-configure.log
          if ($configureCode -ne 0) { exit $configureCode }
          cmd /c "cmake --build --preset release > build-msvc.log 2>&1"
          $buildCode = $LASTEXITCODE
          Get-Content -LiteralPath build-msvc.log
          if ($buildCode -ne 0) { exit $buildCode }
          pwsh -File scripts/check_build_log.ps1 -Log build-msvc-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/check_build_log.ps1 -Log build-msvc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/verify_occt_link.ps1 -BuildDir build/msvc -Report build/msvc/occt-link-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (git rev-parse HEAD).Trim()
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $stamp) | Out-Null
          Set-Content -LiteralPath $stamp -Value "sha=$sha`n" -Encoding utf8NoBOM

      - name: Unit tests
        id: unit-tests
        run: |
          ctest --preset unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 契约腿是 ASan，不能代表产品分配器。这条是 RelWithDebInfo、无 sanitizer。
      # --verbose 让通过时的 memory_round 也进日志。--no-tests=error 避免测试没编进去还算过。
      - name: Memory release on the product allocator
        run: |
          ctest --preset unit -C RelWithDebInfo -R "^MemoryRelease\.SyntheticOpenCloseStaysNearBaseline$" --output-on-failure --verbose --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 400/1200 盒 STEP：加载、网格化、后台 Close、releaseFreedHeap。普通 unit 不设变量所以跳过。
      # --verbose 让通过时的 step_heap_repro 行留在日志里。测试自己跑 10 轮。
      - name: Step heap repro on the product allocator
        env:
          STEPLENS_STEP_HEAP_REPRO: "1"
        run: |
          ctest --preset unit -C RelWithDebInfo -R "^StepHeapRepro\." --output-on-failure --verbose --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 取消中途加载时 pending 必须大于 0。连跑 50 次，门闩没关住就会在这里失败。
      - name: Repeat CancelMidLoad release gate
        run: |
          ctest --preset unit -C RelWithDebInfo -R "^LoadPipeline\.CancelMidLoadReturnsToIdleCube$" --repeat until-fail:50 --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check vcpkg binary cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          $files = @(Get-ChildItem -LiteralPath .vcpkg-binary-cache -Recurse -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw ".vcpkg-binary-cache 是空的，拒绝写入空缓存" }
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host ("vcpkg binary cache: {0} files, {1:N1} MiB" -f $files.Count, ($bytes / 1MB))

      - name: Save vcpkg binary cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-binary-cache
            vcpkg/downloads
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build bench tools against the installed OCCT
        run: |
          $prefix = Join-Path (Get-Location) "build\msvc\vcpkg_installed\x64-windows"
          cmd /c "cmake -S bench -B build/bench -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=`"$prefix`" -DSTEPLENS_EXPECTED_OCCT=7.9.3 > build-bench-config.log 2>&1"
          $configCode = $LASTEXITCODE
          Get-Content -LiteralPath build-bench-config.log
          if ($configCode -ne 0) { exit $configCode }
          cmd /c "cmake --build build/bench > build-bench.log 2>&1"
          $buildCode = $LASTEXITCODE
          Get-Content -LiteralPath build-bench.log
          if ($buildCode -ne 0) { exit $buildCode }
          pwsh -File scripts/check_build_log.ps1 -Log build-bench-config.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/check_build_log.ps1 -Log build-bench.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/verify_occt_link.ps1 -BuildDir build/bench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$pwd\build\msvc\vcpkg_installed\x64-windows\bin;$env:PATH"
          & "$pwd\build\bench\test_compat.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # zip 只在推送到 main 和 v* 标签时产生。PR 不上传 artifact。
      # 缓存保存发生在这一步之前，跳过打包不会丢掉 vcpkg/Qt 缓存。
      - name: Package zip
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          cmake --install build/msvc --config RelWithDebInfo --prefix "$pwd\dist-stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python scripts/package.py `
            --prefix "$pwd\dist-stage" `
            --qt-dir "$env:QTDIR" `
            --vcpkg-bin "$pwd\build\msvc\vcpkg_installed\x64-windows\bin" `
            --output "$pwd\dist\StepLens-0.1.0-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload zip
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-windows-x64
          path: dist/StepLens-0.1.0-windows-x64.zip
          retention-days: 7

      # 非发布 QA 包。qa/ PR 不能代替本次构建成功门；unit 失败不跳过，取消不跑。
      - name: QA package verification
        id: qa-package
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/') && steps.product-build.outcome == 'success' && !cancelled()
        env:
          QA_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $stamp = Join-Path (Get-Location) "build\msvc\this-build-succeeded.txt"
          if (-not (Test-Path -LiteralPath $stamp)) { throw "本次构建未成功，拒绝使用已有产物做 QA 打包" }
          $sha = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$' -or $tree -notmatch '^[0-9a-f]{40}$') {
            throw "checkout SHA/tree 不是 40 位十六进制"
          }
          if ($env:QA_PR_HEAD -notmatch '^[0-9a-f]{40}$') {
            throw "pull_request.head.sha 不是 40 位十六进制，不猜测"
          }
          cmake --install build/msvc --config RelWithDebInfo --prefix "$pwd\dist-stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python scripts/package.py `
            --prefix "$pwd\dist-stage" `
            --qt-dir "$env:QTDIR" `
            --vcpkg-bin "$pwd\build\msvc\vcpkg_installed\x64-windows\bin" `
            --output "$pwd\dist\StepLens-0.1.0-windows-x64.zip" `
            --checkout-sha $sha `
            --checkout-tree $tree `
            --pr-head-sha $env:QA_PR_HEAD `
            --require-redist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload QA package dependency observation
        if: steps.qa-package.outcome == 'failure' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-qa-package-observe
          path: |
            build/msvc/package-dependency-observe.txt
            build/msvc/windows-module-evidence.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare Qt software OpenGL
        id: software-gl
        if: steps.product-build.outcome == 'success' && !cancelled()
        run: |
          # unit 或 offscreen 失败不能跳过。取消不启动。不用 continue-on-error。
          # 每次重新下载并核对官方 SHA。先删本轮 exe 旁的 DLL，已存在不等于已部署。
          $ErrorActionPreference = "Stop"
          $log = Join-Path (Get-Location) "build\msvc\gl-software-prepare.log"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $log) | Out-Null
          Set-Content -LiteralPath $log -Value "result=started" -Encoding utf8NoBOM
          function Add-PrepareLog([string]$line) {
            Add-Content -LiteralPath $log -Value $line -Encoding utf8NoBOM
            Write-Host $line
          }
          $stamp = Join-Path (Get-Location) "build\msvc\this-build-succeeded.txt"
          if (-not (Test-Path -LiteralPath $stamp)) {
            Add-PrepareLog "result=fail reason=missing-build-stamp"
            throw "本次构建未成功，拒绝准备软件库或使用已有的 StepLens.exe"
          }
          $exe = Join-Path (Get-Location) "build\msvc\RelWithDebInfo\StepLens.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Add-PrepareLog "result=fail reason=missing-exe"
            throw "未找到 $exe"
          }
          $swDest = Join-Path (Split-Path -Parent $exe) "opengl32sw.dll"
          if (Test-Path -LiteralPath $swDest) {
            Remove-Item -LiteralPath $swDest -Force
            Add-PrepareLog "removed-existing=$swDest"
          }
          $swUrl = "https://download.qt.io/development_releases/prebuilt/llvmpipe/windows/opengl32sw-64-mesa_11_2_2-signed_sha256.7z"
          $swSha = "c61f801c1760aa24b02c7a8354323cddf368b86f8f5c34b50b3b224f7d728afd"
          $swArchive = Join-Path $env:RUNNER_TEMP "opengl32sw-64-mesa_11_2_2-signed_sha256.7z"
          if (Test-Path -LiteralPath $swArchive) { Remove-Item -LiteralPath $swArchive -Force }
          Add-PrepareLog "download=$swUrl"
          Invoke-WebRequest -UseBasicParsing -Uri $swUrl -OutFile $swArchive
          $swActual = (Get-FileHash -LiteralPath $swArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-PrepareLog "archive_sha256=$swActual"
          if ($swActual -ne $swSha) {
            Add-PrepareLog "result=fail reason=sha256"
            throw "opengl32sw 归档 SHA256 不符: $swActual"
          }
          $swExtract = Join-Path $env:RUNNER_TEMP "opengl32sw-extract"
          if (Test-Path -LiteralPath $swExtract) { Remove-Item -LiteralPath $swExtract -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $swExtract | Out-Null
          & 7z x $swArchive "-o$swExtract" -y
          if ($LASTEXITCODE -ne 0) {
            Add-PrepareLog "result=fail reason=extract exit=$LASTEXITCODE"
            throw "解压 opengl32sw 失败: $LASTEXITCODE"
          }
          $swDll = Get-ChildItem -LiteralPath $swExtract -Recurse -Filter "opengl32sw.dll" -File | Select-Object -First 1
          if (-not $swDll) {
            Add-PrepareLog "result=fail reason=archive-missing-dll"
            throw "归档中没有 opengl32sw.dll"
          }
          Copy-Item -LiteralPath $swDll.FullName -Destination $swDest -Force
          $copied = Get-FileHash -LiteralPath $swDest -Algorithm SHA256
          $sourceHash = Get-FileHash -LiteralPath $swDll.FullName -Algorithm SHA256
          if ($copied.Hash -ne $sourceHash.Hash) {
            if (Test-Path -LiteralPath $swDest) { Remove-Item -LiteralPath $swDest -Force }
            Add-PrepareLog "result=fail reason=copy-hash"
            throw "复制后的 opengl32sw.dll 与解压文件不一致"
          }
          Add-PrepareLog "result=ok"
          Add-PrepareLog "dll=$swDest"
          Add-PrepareLog "dll_sha256=$($copied.Hash.ToLowerInvariant())"
          "dll=$swDest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      # 冒烟读的是 build 目录里的 StepLens.exe，不依赖上面的 zip。PR 上打包被跳过时这里仍然跑。
      # success() 保持 unit 失败时不跑 offscreen。准备失败或构建失败也不能启动。
      - name: Smoke the empty window offscreen
        if: steps.product-build.outcome == 'success' && steps.software-gl.outcome == 'success' && success()
        run: |
          # G1-5：离屏平台没有可判定的 GPU 帧缓冲。这里只确认进程还活着。
          # 100%/150% DPI、resize、逐帧不是单色，见 docs/bench/t09-gpu-smoke-checklist.md。
          # 缺帧缓冲内容不得让本作业变红。程序在 offscreen 下不创建 ViewerWidget。
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = Join-Path $env:QTDIR "plugins"
          $vcpkgBin = Join-Path (Get-Location) "build\msvc\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$vcpkgBin;$(Join-Path $env:QTDIR 'bin');$env:PATH"
          $exe = Join-Path (Get-Location) "build\msvc\RelWithDebInfo\StepLens.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "未找到 $exe" }
          $swDest = "${{ steps.software-gl.outputs.dll }}"
          if ([string]::IsNullOrWhiteSpace($swDest) -or -not (Test-Path -LiteralPath $swDest)) {
            throw "本次 software DLL 未准备好: $swDest"
          }
          # 仅本 step。offscreen 启动和 ctest 子进程继承；不写 GITHUB_ENV。
          $env:QT_OPENGL = "software"
          Write-Host "QT_OPENGL=$env:QT_OPENGL"
          Write-Host "software_dll=$swDest"
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "空窗口进程提前退出，退出码 $($proc.ExitCode)。这一步用的是 QT_QPA_PLATFORM=offscreen，不是交互式桌面。"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "空窗口在 offscreen 平台下保持运行"
          # 模型已经显示后再关窗口。每个进程使用合成 box.step，最多运行 60 秒。
          # 生命周期日志由测试创建唯一 SHA/nonce 文件；HeldClose 由 Close gate 因果控制。
          $env:STEPLENS_APP_EXIT = "1"
          $lifeDir = Join-Path (Split-Path -Parent $exe) "logs"
          New-Item -ItemType Directory -Force -Path $lifeDir | Out-Null
          # AppExit 带 label app_exit，已被 unit 预设排除。这里必须用 --test-dir 发现测试。
          # SKIPPED 不能算成功。offscreen 只覆盖 NullSceneHost 分支。
          $ctestLog = Join-Path $env:RUNNER_TEMP "app-exit-offscreen.log"
          $regex = "^AppExit\.(CloseEventWhileBusyQuickExits|CloseAfterDisplayedModelExitsCleanly|NormalReturnAfterCloseCompletes)$"
          ctest --test-dir build/msvc -C RelWithDebInfo --no-tests=error --output-on-failure --output-log $ctestLog -R $regex
          if ($LASTEXITCODE -ne 0) { throw "产品退出三路径（offscreen）失败，退出码 $LASTEXITCODE" }
          $ctestText = Get-Content -LiteralPath $ctestLog -Raw
          if ($ctestText -match '\[  SKIPPED \]|No tests were found|Not Run') {
            throw "offscreen AppExit 被跳过或未发现，不能算成功"
          }
          # 产品身份是编译期 STEPLENS_GIT_SHA（cmake 写入的构建身份），不是环境注入，也不写死 63e/7f4。
          # 必须实际比较：cmake 身份 == 当前 checkout；合成 merge 的树 == 第二父（受审 HEAD）树。
          $sha = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $parents = @(& git rev-parse "HEAD^@" 2>$null)
          $idFile = Join-Path (Get-Location) "build\msvc\steplens-build-identity.txt"
          if (-not (Test-Path -LiteralPath $idFile)) { throw "缺少构建身份文件 $idFile" }
          $idText = Get-Content -LiteralPath $idFile -Raw
          . ./.github/scripts/Assert-SteplensBuildIdentity.ps1
          Assert-SteplensBuildIdentity -IdentityText $idText -CheckoutSha $sha -CheckoutTree $tree -Parents $parents -ResolveSecondParentWithGit
          $lifeFiles = @(Get-ChildItem -LiteralPath $lifeDir -Filter "lifecycle-$sha-*.log" -File)
          if ($lifeFiles.Count -lt 3) { throw "本轮 offscreen 生命周期日志不足 3 份（SHA $sha）" }
          foreach ($lifeFile in $lifeFiles) {
            Write-Host "---- $($lifeFile.FullName) ----"
            $text = Get-Content -LiteralPath $lifeFile.FullName -Raw
            Write-Host $text
            Write-Host "---- end ----"
            if ($text -notmatch "event=lifecycle-open identity=$sha ") { throw "$($lifeFile.Name) 缺少本次 SHA" }
          }
          $busy = ($lifeFiles | Where-Object Name -Match "offscreen-close-while-busy").Count
          $held = ($lifeFiles | Where-Object Name -Match "offscreen-quit-when-ready").Count
          $normal = ($lifeFiles | Where-Object Name -Match "offscreen-normal-return").Count
          if ($busy -lt 1 -or $held -lt 1 -or $normal -lt 1) { throw "本轮 offscreen 三条路径日志未齐" }
          $heldText = Get-Content -LiteralPath ($lifeFiles | Where-Object Name -Match "offscreen-quit-when-ready" | Select-Object -First 1).FullName -Raw
          if ($heldText -notmatch "event=main-after-window identity=pending=([1-9]\d*) " -or $heldText -notmatch "event=main-quick-exit-pending") { throw "HeldClose 缺少 pending>0 因果回执" }
          $normalText = Get-Content -LiteralPath ($lifeFiles | Where-Object Name -Match "offscreen-normal-return" | Select-Object -First 1).FullName -Raw
          if ($normalText -notmatch "event=main-normal-return" -or $normalText -notmatch "event=retirer-end") { throw "正常 return 缺少 retirer-end" }


      # 构建成功且本轮 software 准备成功才跑。success()||failure() 让前置 unit 失败后仍采证；取消不跑。
      # 不使用 continue-on-error。Viewer 非 0 用原退出码；身份失败在 Viewer 为 0 时仍让本步失败。
      - name: Smoke product shutdown with viewer and tree
        if: steps.product-build.outcome == 'success' && steps.software-gl.outcome == 'success' && (success() || failure())
        run: |
          # 非 offscreen 隐藏窗口：三条真实 Viewer/tree 路径，不是像素拾取或帧对比。
          # 每个进程用合成 box.step、硬超时 60 秒和本轮唯一 SHA/nonce 生命周期日志。
          # 不用 --preset unit，否则 app_exit 标签会被排除。
          $stamp = Join-Path (Get-Location) "build\msvc\this-build-succeeded.txt"
          if (-not (Test-Path -LiteralPath $stamp)) { throw "本次构建未成功，拒绝采证已有的 StepLens.exe" }
          $env:QT_PLUGIN_PATH = Join-Path $env:QTDIR "plugins"
          $vcpkgBin = Join-Path (Get-Location) "build\msvc\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$vcpkgBin;$(Join-Path $env:QTDIR 'bin');$env:PATH"
          if (Test-Path Env:QT_QPA_PLATFORM) { Remove-Item Env:QT_QPA_PLATFORM }
          $exe = Join-Path (Get-Location) "build\msvc\RelWithDebInfo\StepLens.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "未找到 $exe" }
          $lifeDir = Join-Path (Split-Path -Parent $exe) "logs"
          New-Item -ItemType Directory -Force -Path $lifeDir | Out-Null
          $evidence = Join-Path (Get-Location) "build\msvc\view-crash-identity"
          $sha = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $idFile = Join-Path (Get-Location) "build\msvc\steplens-build-identity.txt"
          & ./.github/scripts/Record-SteplensLaunchIdentity.ps1 -Exe $exe -OutDir $evidence -Phase before -CheckoutSha $sha -CheckoutTree $tree -IdentityFile $idFile
          $identityBefore = $LASTEXITCODE
          $env:STEPLENS_APP_EXIT_VIEWER = "1"
          # 三路子进程继承这个目录，各自写 logs\gl-init-<pid>.txt，不另造上下文。
          $env:STEPLENS_GL_INIT_TRACE = $lifeDir
          $swDest = "${{ steps.software-gl.outputs.dll }}"
          if ([string]::IsNullOrWhiteSpace($swDest) -or -not (Test-Path -LiteralPath $swDest)) {
            throw "本次 software DLL 未准备好: $swDest"
          }
          # 仅本 step。三路 ctest 子进程继承 software；不写 GITHUB_ENV。
          $env:QT_OPENGL = "software"
          Write-Host "QT_OPENGL=$env:QT_OPENGL"
          Write-Host "software_dll=$swDest"
          $ctestLog = Join-Path $env:RUNNER_TEMP "app-exit-viewer.log"
          $regex = "^AppExit\.(ViewerTreeCloseEventWhileBusy|ViewerTreeQuitWhenReadyHeldClose|ViewerTreeNormalReturn)$"
          ctest --test-dir build/msvc -C RelWithDebInfo --no-tests=error --output-on-failure --output-log $ctestLog -R $regex
          $viewerCode = $LASTEXITCODE
          & ./.github/scripts/Record-SteplensLaunchIdentity.ps1 -Exe $exe -OutDir $evidence -Phase after -CheckoutSha $sha -CheckoutTree $tree -IdentityFile $idFile
          $identityAfter = $LASTEXITCODE
          Get-ChildItem -LiteralPath $lifeDir -Filter "gl-backend-*.txt" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "---- $($_.FullName) ----"
            Write-Host (Get-Content -LiteralPath $_.FullName -Raw)
            Write-Host "---- end ----"
          }
          if ($viewerCode -ne 0) { exit $viewerCode }
          if ($identityBefore -ne 0 -or $identityAfter -ne 0) {
            throw "启动 exe/PDB 符号身份缺证，before=$identityBefore after=$identityAfter"
          }
          $ctestText = Get-Content -LiteralPath $ctestLog -Raw
          if ($ctestText -match '\[  SKIPPED \]|No tests were found|Not Run') {
            throw "Viewer AppExit 被跳过或未发现，不能算成功"
          }
          # 产品身份是编译期 STEPLENS_GIT_SHA（cmake 写入的构建身份），不是环境注入，也不写死 63e/7f4。
          # 必须实际比较：cmake 身份 == 当前 checkout；合成 merge 的树 == 第二父（受审 HEAD）树。
          $sha = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $parents = @(& git rev-parse "HEAD^@" 2>$null)
          $idFile = Join-Path (Get-Location) "build\msvc\steplens-build-identity.txt"
          if (-not (Test-Path -LiteralPath $idFile)) { throw "缺少构建身份文件 $idFile" }
          $idText = Get-Content -LiteralPath $idFile -Raw
          . ./.github/scripts/Assert-SteplensBuildIdentity.ps1
          Assert-SteplensBuildIdentity -IdentityText $idText -CheckoutSha $sha -CheckoutTree $tree -Parents $parents -ResolveSecondParentWithGit
          $lifeFiles = @(Get-ChildItem -LiteralPath $lifeDir -Filter "lifecycle-$sha-*.log" -File)
          if ($lifeFiles.Count -lt 3) { throw "本轮 Viewer/tree 生命周期日志不足 3 份（SHA $sha）" }
          foreach ($lifeFile in $lifeFiles) {
            Write-Host "---- $($lifeFile.FullName) ----"
            $text = Get-Content -LiteralPath $lifeFile.FullName -Raw
            Write-Host $text
            Write-Host "---- end ----"
            if ($text -notmatch "event=lifecycle-open identity=$sha ") { throw "$($lifeFile.Name) 缺少本次 SHA" }
          }
          $busyFile = $lifeFiles | Where-Object Name -Match "viewer-close-while-busy" | Select-Object -First 1
          $heldFile = $lifeFiles | Where-Object Name -Match "viewer-held-close" | Select-Object -First 1
          $normalFile = $lifeFiles | Where-Object Name -Match "viewer-normal" | Select-Object -First 1
          if (-not $busyFile -or -not $heldFile -or -not $normalFile) { throw "本轮 Viewer/tree 三条路径日志未齐" }
          $heldText = Get-Content -LiteralPath $heldFile.FullName -Raw
          if ($heldText -notmatch "event=main-after-window identity=pending=([1-9]\d*) ") { throw "$($heldFile.Name) 缺少 pending>0" }
          foreach ($required in @("event=mainwindow-destructor-begin", "event=mainwindow-destructor-end", "event=mainwindow-members-begin", "event=mainwindow-members-end", "event=qobject-child-destroyed identity=viewerWidget", "event=qobject-child-destroyed identity=assemblyTreePanel", "event=main-quick-exit-pending")) {
            if ($heldText -notmatch [regex]::Escape($required)) { throw "$($heldFile.Name) 缺少 $required" }
          }
          $busyText = Get-Content -LiteralPath $busyFile.FullName -Raw
          if ($busyText -notmatch "event=viewer-created" -or $busyText -notmatch "event=mainwindow-closeEvent-busy") { throw "Viewer busy-close 缺少事件" }
          $normalText = Get-Content -LiteralPath $normalFile.FullName -Raw
          if ($normalText -notmatch "event=main-normal-return" -or $normalText -notmatch "event=retirer-end") { throw "Viewer 正常 return 缺少 retirer-end" }

      # 真实 Viewer 帧。不设置 offscreen。无图、空图、整幅单色都失败。
      # 本次构建和 software 准备都成功且未取消才启动。qa/ 不能代替这两道门。
      - name: QA view framebuffer
        id: qa-view
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/') && steps.product-build.outcome == 'success' && steps.software-gl.outcome == 'success' && !cancelled()
        run: |
          $stamp = Join-Path (Get-Location) "build\msvc\this-build-succeeded.txt"
          if (-not (Test-Path -LiteralPath $stamp)) { throw "本次构建未成功，拒绝使用已有的 StepLens.exe 做帧验收" }
          $swDest = "${{ steps.software-gl.outputs.dll }}"
          if ([string]::IsNullOrWhiteSpace($swDest) -or -not (Test-Path -LiteralPath $swDest)) {
            throw "本次 software DLL 未准备好: $swDest"
          }
          # 仅本 step。帧验收进程继承 software、Qt 插件和 OCCT DLL；不写 GITHUB_ENV。
          $env:QT_PLUGIN_PATH = Join-Path $env:QTDIR "plugins"
          $vcpkgBin = Join-Path (Get-Location) "build\msvc\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$vcpkgBin;$(Join-Path $env:QTDIR 'bin');$env:PATH"
          $env:QT_OPENGL = "software"
          Write-Host "QT_OPENGL=$env:QT_OPENGL"
          Write-Host "software_dll=$swDest"
          if (Test-Path Env:QT_QPA_PLATFORM) { Remove-Item Env:QT_QPA_PLATFORM }
          $sha = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $bin = Join-Path (Get-Location) "build\msvc\RelWithDebInfo"
          $dump = Join-Path (Get-Location) "dist\view-shot"
          & ./.github/scripts/Assert-SteplensViewShot.ps1 `
            -Exe (Join-Path $bin "StepLens.exe") `
            -Writer (Join-Path $bin "steplens_write_box_step.exe") `
            -DumpDir $dump `
            -IdentityFile (Join-Path (Get-Location) "build\msvc\steplens-build-identity.txt") `
            -CheckoutSha $sha `
            -CheckoutTree $tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 成功验收包只在打包和帧都成功后上传。退出码 0 或已有 zip 不是像素通过。
      - name: Upload QA package verification
        if: steps.qa-package.outcome == 'success' && steps.qa-view.outcome == 'success' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-qa-windows-x64
          path: |
            dist/StepLens-0.1.0-windows-x64.zip
            dist/StepLens-0.1.0-windows-x64.zip.manifest.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload QA view framebuffer
        if: steps.qa-view.outcome == 'success' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-qa-view-shot
          path: dist/view-shot/**
          retention-days: 7
          if-no-files-found: error

      - name: Upload QA view failure evidence
        if: steps.qa-view.outcome == 'failure' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-qa-view-shot-failure
          path: dist/view-shot/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload viewer crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-viewer-crash
          path: |
            build/msvc/**/*.dmp
            build/msvc/**/*.stack.txt
            build/msvc/**/gl-init-*.txt
            build/msvc/gl-software-prepare.log
            build/msvc/view-crash-identity/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Qt software backend evidence
        if: steps.product-build.outcome == 'success' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-gl-backend
          path: build/msvc/**/gl-backend-*.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: clang-tidy changed C++ files
        run: |
          $clangTidy = "C:\Program Files\LLVM\bin\clang-tidy.exe"
          if (-not (Test-Path -LiteralPath $clangTidy)) { throw "未找到 $clangTidy" }
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = git merge-base HEAD "origin/$env:GITHUB_BASE_REF"
          } else {
            $base = "HEAD~1"
          }
          $files = @(git diff --name-only --diff-filter=ACMR $base HEAD)
          # bench/ 是独立摸底工具，编译数据库在 build/bench，不在主工程这份里。
          $cpp = @($files | Where-Object { $_ -match '\.cpp$' -and $_ -notmatch '^bench/' })
          if ($cpp.Count -eq 0) {
            Write-Host "没有改动的 .cpp，跳过 clang-tidy"
            exit 0
          }
          # clang-cl 不认识 /MP 和 /external:anglebrackets，clang-tidy 会把这两条未使用参数当成错误。
          # /w 只关掉编译器警告。/WX 仍留给 cl.exe。clang-tidy 自己的检查还在。
          python scripts/select_compile_commands.py `
            --input build/msvc/compile_commands.json `
            --output-dir build/msvc-tidy `
            --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clangTidy -p build/msvc-tidy `
            --extra-arg-before=--driver-mode=cl `
            --extra-arg=-Wno-unused-command-line-argument `
            --extra-arg=/w `
            @cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  redist-probe:
    name: redist-probe
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'redist-probe'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout probe script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Read-only Redist probe
        run: python scripts/redist_probe.py --output build/redist-probe.txt

      - name: Upload Redist probe text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StepLens-redist-probe
          path: build/redist-probe.txt
          retention-days: 7
          if-no-files-found: error
